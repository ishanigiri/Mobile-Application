<!DOCTYPE html>
<html>
<head>
    <title>Division Calculator</title>

    <style>
        body{
            font-family: Arial;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box{
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            width: 300px;
            box-shadow: 0px 0px 10px gray;
        }

        input{
            width: 90%;
            padding: 8px;
            margin: 5px;
        }

        button{
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover{
            background: darkblue;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>Division Calculator</h2>

        <input type="number" id="m1" placeholder="Subject 1">
        <input type="number" id="m2" placeholder="Subject 2">
        <input type="number" id="m3" placeholder="Subject 3">
        <input type="number" id="m4" placeholder="Subject 4">
        <input type="number" id="m5" placeholder="Subject 5">
        <input type="number" id="m6" placeholder="Subject 6">
        <input type="number" id="m7" placeholder="Subject 7">
        <input type="number" id="m8" placeholder="Subject 8">

        <br><br>

        <button onclick="checkResult()">Check Result</button>

        <h3 id="result"></h3>

    </div>

    <script src="result.js"></script>

</body>
</html>
